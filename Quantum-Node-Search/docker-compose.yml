version: '3.8'

services:
  quantum-search:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - QT_QPA_PLATFORM=offscreen
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    container_name: quantum-search-app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Optional: Jupyter notebook server for interactive exploration
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8888:8888"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./notebooks:/app/notebooks
      - ./data:/app/data
    container_name: quantum-search-jupyter
    restart: unless-stopped
    command: >
      jupyter notebook 
      --ip=0.0.0.0 
      --port=8888 
      --no-browser 
      --allow-root
      --NotebookApp.token='' 
      --NotebookApp.password=''

volumes:
  quantum-data:
    driver: local
